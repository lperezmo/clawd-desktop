[package]
name = "clawd-desktop"
version = "0.4.1"
edition = "2024"
description = "Clawd walks along the edges of your windows and the taskbar."
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[build-dependencies]
winresource = "0.1"

[[example]]
name = "make-icon"
path = "tools/make-icon.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
