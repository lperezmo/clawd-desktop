name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-exe:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build release
        run: cargo build --release
      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/clawd-desktop.exe "dist/Clawd-Desktop-${{ needs.release.outputs.version }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: clawd-desktop-windows-x64
          path: dist/
          # The exe is also attached to the GitHub release, so this copy is short-lived.
          retention-days: 7
      - name: Upload exe to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/*.exe --clobber
      - name: Drop the Cargo.lock asset semantic-release attaches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release delete-asset "${{ needs.release.outputs.tag }}" Cargo.lock --yes; exit 0
